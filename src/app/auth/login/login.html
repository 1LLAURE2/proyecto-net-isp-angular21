<div class="flex items-center justify-center min-h-screen bg-gray-100">
      <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800">Iniciar Sesión</h2>

        <form class="space-y-5" (ngSubmit)="onLogin()">
          <!-- Email -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="email">Correo</label>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <!-- Password -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700" for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="********"
              required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full py-2 text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200"
          >
            Iniciar Sesión
          </button>

          <!-- Opciones adicionales -->
          <p class="text-sm text-center text-gray-500">
            ¿No tienes cuenta?
            <a href="#" class="text-indigo-600 hover:underline">Regístrate</a>
          </p>
        </form>
      </div>
    </div>
