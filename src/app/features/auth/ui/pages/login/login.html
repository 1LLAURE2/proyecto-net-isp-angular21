<div class="flex items-center justify-center min-h-screen"
      style="background-color: var(--bg-color); color: var(--text-color);">
      <div class="w-full max-w-md p-8 space-y-6 rounded-xl shadow-md" style="background-color: var(--card-bg);">
        <h2 class="text-2xl font-bold text-center mb-4" style="color: var(--text-color);">Iniciar Sesión</h2>

        <form class="space-y-5" (ngSubmit)="login()">
          <!-- Email -->
          <div>
            <label class="block mb-2 text-sm font-medium" style="color: var(--text-color);" for="email">Correo</label>
            <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="ejemplo@correo.com" required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:border-primary"
              style="background-color: var(--card-bg); color: var(--text-color); border-color: var(--text-color);" />
          </div>

          <!-- Password -->
          <div>
            <label class="block mb-2 text-sm font-medium" style="color: var(--text-color);"
              for="password">Contraseña</label>
            <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="********" required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:border-primary"
              style="background-color: var(--card-bg); color: var(--text-color); border-color: var(--text-color);" />
          </div>

          <!-- Submit -->
          <button type="submit"
            class="w-full py-2 rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 transition duration-200"
            style="background-color: var(--primary-color); color: var(--text-color);">
            Iniciar Sesión
          </button>

          <!-- Opciones adicionales -->
          <p class="text-sm text-center" style="color: var(--text-color);">
            ¿No tienes cuenta?
            <a href="#" style="color: var(--primary-color); text-decoration: underline;">Regístrate</a>
          </p>
        </form>

        <!-- Toggle de tema -->
        <div class="text-center mt-4">
          <button (click)="toggleTheme()" class="px-4 py-2 rounded"
            style="background-color: var(--primary-color); color: var(--text-color);">
            Cambiar tema
          </button>
        </div>
      </div>
    </div>
