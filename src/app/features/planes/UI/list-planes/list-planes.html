<p>Total: {{ (plans$ | async)?.length }}</p>

<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Planes</h1>

  <table class="w-full text-sm border">
    <thead>
      <tr>
        <th class="p-2">Nombre</th>
        <th class="p-2">Precio</th>
        <th class="p-2">Velocidad</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let plan of plans$ | async" class="border-t">
        <td class="p-2">{{ plan.name }}</td>
        <td class="p-2">S/ {{ plan.price }}</td>
        <td class="p-2">{{ plan.speed }} Mbps</td>
      </tr>
    </tbody>
  </table>
</div>
