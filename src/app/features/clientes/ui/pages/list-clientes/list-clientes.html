<h1>Clientes</h1>

      <li *ngFor="let cliente of clientes">
        {{ cliente.nombre }} - {{ cliente.email }}
      </li>
    </ul> -->

<!--  -->
<div class="min-h-screen p-4 md:p-6" [ngStyle]="{'background-color':'var(--bg-color)', 'color':'var(--text-color)'}">

  <!-- HEADER -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">

    <div>
      <h1 class="text-2xl md:text-3xl font-bold">
        Administración de Clientes
      </h1>
      <p class="text-sm opacity-70">
        Gestiona tus clientes y sus planes
      </p>
    </div>

    <!-- BOTÓN NUEVO CLIENTE -->
    <button class="px-4 py-2 rounded-lg text-white font-medium flex items-center gap-2"
      [ngStyle]="{'background-color':'var(--secondary-color)'}" (click)="addClient()">

      ➕ Nuevo Cliente

    </button>

  </div>

  <!-- FILTROS -->
  <div class="rounded-xl shadow-sm p-4 mb-6 flex flex-col md:flex-row gap-4"
    [ngStyle]="{'background-color':'var(--card-bg)'}">

    <!-- BUSCADOR -->
    <div class="flex-1">
      <input type="text" placeholder="Buscar cliente..."
        class="w-full px-4 py-2 rounded-lg border focus:outline-none focus:ring-2"
        [ngStyle]="{'border-color':'var(--primary-color)'}" [(ngModel)]="searchTerm" />
    </div>

    <!-- ESTADO -->
    <div class="w-full md:w-48">
      <select [(ngModel)]="statusFilter" class="w-full px-4 py-2 rounded-lg border"
        [ngStyle]="{'border-color':'var(--primary-color)'}">

        <option value="">Estado</option>
        <option value="activo">Activo</option>
        <option value="pendiente">Pendiente</option>
        <option value="inactivo">Inactivo</option>

      </select>
    </div>

    <!-- PLAN -->
    <div class="w-full md:w-48">
      <select [(ngModel)]="planFilter" class="w-full px-4 py-2 rounded-lg border"
        [ngStyle]="{'border-color':'var(--primary-color)'}">

        <option value="">Plan</option>
        <option value="premium">Premium</option>
        <option value="basico">Básico</option>
        <option value="estandar">Estándar</option>

      </select>
    </div>

    <!-- RESET FILTROS -->
    <button class="px-4 py-2 rounded-lg border font-medium" (click)="resetFilters()"
      [ngStyle]="{'border-color':'var(--accent-color)', 'color':'var(--accent-color)'}">

      Restablecer

    </button>

  </div>

  <!-- TABLA -->
  <div class="rounded-xl shadow-sm overflow-hidden" [ngStyle]="{'background-color':'var(--card-bg)'}">

    <div class="overflow-x-auto">

      <table class="min-w-full text-sm">

        <thead class="text-left border-b" [ngStyle]="{'border-color':'var(--primary-color)'}">

          <tr class="text-xs uppercase tracking-wide">
            <th class="px-6 py-3">Cliente</th>
            <th class="px-6 py-3">Email</th>
            <th class="px-6 py-3">Plan</th>
            <th class="px-6 py-3">Estado</th>
            <th class="px-6 py-3">Acciones</th>
          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let client of paginatedClients()"
            class="border-b hover:bg-gray-100 dark:hover:bg-gray-800 transition">

            <td class="px-6 py-4 font-medium">
              {{client.name}}
            </td>

            <td class="px-6 py-4">
              {{client.email}}
            </td>

            <td class="px-6 py-4">
              {{client.plan}}
            </td>

            <td class="px-6 py-4">
              {{client.status}}
            </td>

            <td class="px-6 py-4 flex gap-2">

              <button class="px-3 py-1 text-white rounded-md text-xs"
                [ngStyle]="{'background-color':'var(--primary-color)'}">
                Editar
              </button>

              <button class="px-3 py-1 text-white rounded-md text-xs"
                [ngStyle]="{'background-color':'var(--accent-color)'}">
                Eliminar
              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <!--  -->
      <div class="flex flex-col md:flex-row items-center justify-between p-4 border-t gap-3"
        [ngStyle]="{'border-color':'var(--primary-color)'}">

        <p class="text-sm opacity-70">
          Página {{currentPage}} de {{totalPages()}}
        </p>

        <div class="flex gap-2">

          <!-- ANTERIOR -->
          <button class="px-3 py-1 rounded border" (click)="changePage(currentPage - 1)">
            Anterior
          </button>

          <!-- NÚMEROS -->
          <button *ngFor="let page of [].constructor(totalPages()); let i = index" class="px-3 py-1 rounded border"
            [class.font-bold]="currentPage === i + 1"
            [ngStyle]="currentPage === i + 1 ? {'background-color':'var(--primary-color)', 'color':'white'} : {}"
            (click)="changePage(i + 1)">

            {{i + 1}}

          </button>

          <!-- SIGUIENTE -->
          <button class="px-3 py-1 rounded border" (click)="changePage(currentPage + 1)">
            Siguiente
          </button>

        </div>

      </div>
      <!--  -->
    </div>

  </div>

</div>
