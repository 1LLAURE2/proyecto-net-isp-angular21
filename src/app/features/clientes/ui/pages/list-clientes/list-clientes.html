<div class="min-h-screen p-4 md:p-6" [ngStyle]="{'background-color':'var(--bg-color)', 'color':'var(--text-color)'}">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">

    <div>
      <h1 class="text-2xl md:text-3xl font-bold">
        Administración de Clientes
      </h1>

      <p class="text-sm opacity-70">
        Gestiona tus clientes y sus planes
      </p>
    </div>

    <!-- <button class="w-full sm:w-auto px-4 py-2 rounded-lg text-white font-medium flex items-center justify-center gap-2"
      [ngStyle]="{'background-color':'var(--secondary-color)'}" (click)="addClient()">

      ➕ Nuevo Cliente

    </button> -->
    <app-custom-button
      label="Nuevo Cliente"
      variant="solid"
      color="secondary"
      size="md"
      (onClick)="addClient()">

      <span icon>➕</span>

    </app-custom-button>

  </div>


  <!-- FILTROS -->
  <div class="rounded-xl shadow-sm p-4 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
    [ngStyle]="{'background-color':'var(--card-bg)'}">

    <input type="text" placeholder="Buscar cliente..." class="w-full px-4 py-2 rounded-lg border focus:outline-none"
      [ngStyle]="{'border-color':'var(--primary-color)'}" [(ngModel)]="searchTerm" />

    <select [(ngModel)]="statusFilter" class="w-full px-4 py-2 rounded-lg border"
      [ngStyle]="{'border-color':'var(--primary-color)'}">

      <option value="">Estado</option>
      <option value="activo">Activo</option>
      <option value="pendiente">Pendiente</option>
      <option value="inactivo">Inactivo</option>

    </select>

<!-- TODO : SELECT DE PLANES -->
    <!-- <select [(ngModel)]="planFilter" class="w-full px-4 py-2 rounded-lg border"
      [ngStyle]="{'border-color':'var(--primary-color)'}">
      <option value="">Plan</option>
      <option value="premium">Premium</option>
      <option value="basico">Básico</option>
      <option value="estandar">Estándar</option>
    </select> -->
    <app-custom-select
      [options]="planes"
      [(value)]="planFilter"
      placeholder="Seleccione un Plan">
    </app-custom-select>
<!-- TODO : FIN SELECT DE PLANES -->

    <!-- <button class="w-full px-4 py-2 rounded-lg border font-medium" (click)="resetFilters()"
      [ngStyle]="{'border-color':'var(--accent-color)','color':'var(--accent-color)'}">
      Restablecer
    </button> -->
    <app-custom-button
      label="Restablecer"
      variant="outline"
      color="accent"
      size="md"
      [fullWidth]="true"
      (onClick)="resetFilters()">
    </app-custom-button>

  </div>

  <div class="flex justify-end mb-4">
    <app-custom-seleccion-items-por-pagina
      [options]="pageSizeOptions"
      [value]="itemsPerPage"
      (valueChange)="onPageSizeChange($event)">
    </app-custom-seleccion-items-por-pagina>
  </div>

  <!-- CLIENTES MOBILE (CARDS) -->
  <app-clientes-mobile
    [clients]="paginatedClients()"
    [currentPage]="currentPage"
    [totalPagesCount]="totalPages()"
    (pageChange)="changePage($event)">
  </app-clientes-mobile>


  <!-- TABLA DESKTOP -->
  <app-clientes-desktop
    [clients]="paginatedClients()"
    [currentPage]="currentPage"
    [totalPagesCount]="totalPages()"
    [isDarkMode]="isDarkMode"
    (pageChange)="changePage($event)">
  </app-clientes-desktop>

</div>
