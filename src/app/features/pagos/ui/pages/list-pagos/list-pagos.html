<!-- HEADER -->
<h1 class="text-2xl md:text-3xl font-bold mb-4">Pagos</h1>

<input
  type="text"
  (input)="onSearch($event.target.value)"
  placeholder="Buscar..."
  class="w-full md:w-1/3 px-4 py-2 mb-4 border rounded-lg"
/>

<!-- MOBILE / TABLET -->
<ng-container *ngIf="!(isDesktop$ | async); else desktopView">

  <div class="space-y-4">
    @for (p of payments; track p.id) {
      <div class="p-4 rounded-xl shadow border bg-white">

        <div class="flex justify-between mb-2">
          <h3 class="font-semibold">#{{ p.transaction }}</h3>
          <span class="text-sm font-bold">S/ {{ p.amount }}</span>
        </div>

        <p class="text-sm">👤 {{ p.client.name }}</p>
        <p class="text-sm">💳
          <app-custom-badge
            [value]="p.method"
            type="method">
          </app-custom-badge>
        </p>

      </div>
    }
  </div>

</ng-container>

<!-- DESKTOP -->
<ng-template #desktopView>

  <div class="rounded-xl shadow overflow-hidden">
    <div class="overflow-x-auto">

      <table class="w-full text-sm">

        <thead class="bg-gray-100">
          <tr class="text-left">
            <th class="px-6 py-3">Transacción</th>
            <th class="px-6 py-3">Cliente</th>
            <th class="px-6 py-3">Monto</th>
            <th class="px-6 py-3">Método</th>
          </tr>
        </thead>

        <tbody>
          @for (p of payments; track p.id) {
            <tr class="border-b hover:bg-gray-50">

              <td class="px-6 py-4">{{ p.transaction }}</td>
              <td class="px-6 py-4">{{ p.client.name }}</td>
              <td class="px-6 py-4">S/ {{ p.amount }}</td>

              <td class="px-6 py-4">
                <app-custom-badge
                [value]="p.method"
                type="method">
                </app-custom-badge>
              </td>

            </tr>
          }
        </tbody>

      </table>

    </div>
  </div>

</ng-template>

<!-- PAGINACIÓN -->
<div class="mt-4">
  <app-custom-paginacion
    [currentPage]="meta.current_page"
    [totalPages]="meta.last_page"
    (pageChange)="onPageChange($event)">
  </app-custom-paginacion>
</div>
