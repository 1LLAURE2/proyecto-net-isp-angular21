<!-- HEADER -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4 gap-3">
  <h1 class="text-2xl md:text-3xl font-bold">Pagos</h1>

  <app-custom-button
    label="Nuevo Pago"
    color="secondary"
    (onClick)="onPay()">
    <span icon>💰</span>
  </app-custom-button>
</div>

<!-- FILTROS -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">

  <!-- Buscar -->
  <input
    type="text"
    (input)="onSearch($event.target.value)"
    placeholder="Buscar..."
    class="w-full px-4 py-2 border rounded-lg"
  />

  <!-- Fecha inicio -->
  <input
    type="date"
    [(ngModel)]="filters.date_from"
    (change)="loadPayments()"
    class="w-full px-4 py-2 border rounded-lg"
  />

  <!-- Fecha fin -->
  <input
    type="date"
    [(ngModel)]="filters.date_to"
    (change)="loadPayments()"
    class="w-full px-4 py-2 border rounded-lg"
  />

  <!-- Reset -->
  <app-custom-button
    label="Limpiar"
    variant="outline"
    color="accent"
    (onClick)="resetFilters()">
  </app-custom-button>

</div>

<!-- MOBILE / TABLET -->
<ng-container *ngIf="!(isDesktop$ | async); else desktopView">

  <div class="space-y-4">
    @for (p of payments; track p.id) {
      <div class="p-4 rounded-xl shadow border bg-white">

        <div class="flex justify-between mb-2">
          <h3 class="font-semibold">#{{ p.transaction }}</h3>
          <span class="text-sm font-bold">S/ {{ p.amount }}</span>
        </div>

        <p class="text-sm">👤 {{ p.client.name }}</p>

        <p class="text-sm mb-3">
          💳
          <app-custom-badge [value]="p.method" type="method"></app-custom-badge>
        </p>

        <!-- ACCIONES -->
        <div class="flex flex-wrap gap-2">
          <app-custom-button
            label="Ver"
            size="sm"
            color="primary"
            (onClick)="onViewPayment(p)">
          </app-custom-button>

          <app-custom-button
            label="Pagar"
            size="sm"
            color="secondary"
            (onClick)="onPay(p)">
          </app-custom-button>
        </div>

      </div>
    }
  </div>

</ng-container>

<!-- DESKTOP -->
<ng-template #desktopView>

  <div class="rounded-xl shadow overflow-hidden">
    <div class="overflow-x-auto">

      <table class="w-full text-sm">

        <thead class="bg-gray-100">
          <tr class="text-left">
            <th class="px-6 py-3">Transacción</th>
            <th class="px-6 py-3">Cliente</th>
            <th class="px-6 py-3">Monto</th>
            <th class="px-6 py-3">Método</th>
            <th class="px-6 py-3">Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (p of payments; track p.id) {
            <tr class="border-b hover:bg-gray-50">

              <td class="px-6 py-4">{{ p.transaction }}</td>
              <td class="px-6 py-4">{{ p.client.name }}</td>
              <td class="px-6 py-4">S/ {{ p.amount }}</td>

              <td class="px-6 py-4">
                <app-custom-badge
                  [value]="p.method"
                  type="method">
                </app-custom-badge>
              </td>

              <!-- ACCIONES -->
              <td class="px-6 py-4">
                <div class="flex flex-wrap gap-2">

                  <app-custom-button
                    label="Ver"
                    size="sm"
                    color="primary"
                    (onClick)="onViewPayment(p)">
                  </app-custom-button>

                  <app-custom-button
                    label="Pagar"
                    size="sm"
                    color="secondary"
                    (onClick)="onPay(p)">
                  </app-custom-button>

                </div>
              </td>

            </tr>
          }
        </tbody>

      </table>

    </div>
  </div>

</ng-template>

<!-- PAGINACIÓN -->
<div class="mt-4">
  <app-custom-paginacion
    [currentPage]="meta.current_page"
    [totalPages]="meta.last_page"
    (pageChange)="onPageChange($event)">
  </app-custom-paginacion>
</div>
